apiVersion: v1
kind: Service
metadata:
  name: storage-stateful-headless
  namespace: dev
spec:
  clusterIP: None
  selector:
    app: storage-stateful-demo
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-stateful-demo
  namespace: dev
spec:
  serviceName: storage-stateful-headless
  replicas: 2
  selector:
    matchLabels:
      app: storage-stateful-demo
  template:
    metadata:
      labels:
        app: storage-stateful-demo
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 500Mi
