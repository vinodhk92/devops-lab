apiVersion: v1
kind: Pod
metadata:
  name: storage-demo
  namespace: dev
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: devops-lab-api-pvc
